name: Validate Simbli Scraper

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Read-only diagnostic: checkout + artifact upload, no pushes or API writes.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Provenance Contract Tests
        run: |
          npm run test:provenance
          npm run test:policy-llm-provenance
          npm run test:release
          npm run test:release-smoke
          # The freshness guard is what tells us a principal or the
          # superintendent has drifted, and what enforces that year-scoped
          # constants stay consistent. If its own tests never run on a push,
          # a broken guard merges silently and is only noticed when the
          # scheduled pipeline stops catching things.
          npm run test:freshness
          npm run validate:provenance -- --metadata-only

      - name: Verify Fail-Closed Multi-District Lab Build
        run: |
          npm run test:platform
          npm run build:platform

      - name: Verify Policy Provenance Pages and Release Allowlist
        run: |
          npm run build:policies
          node scripts/verify-policy-pages.mjs
          git diff --exit-code -- \
            data/provenance/ \
            docs/policies-index.json \
            docs/policies/ \
            docs/politicas/ \
            docs/board-policies/ \
            docs/board-policies-es/ \
            docs/schemas/provenance/v1/

      - name: Run HTML sanitizer regression tests
        run: node scripts/test-html-sanitizers.mjs

      - name: Run Simbli Connectivity Diagnostic
        run: node scripts/test-simbli-environment.mjs

      - name: Upload Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simbli-diagnostics
          path: test-results/
          retention-days: 7
