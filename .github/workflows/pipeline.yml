name: Scheduled Board Ingestion Pipeline

on:
  schedule:
    # Run twice daily at 6:00 AM and 6:00 PM UTC (11:00 PM and 11:00 AM PDT)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick mode (skip transcription, translation, and LLM mapping)'
        required: true
        type: boolean
        default: false
      refresh_all:
        description: 'Uncap stale-cache refreshes (translations, chapter markers, timestamp maps) for this run'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner environment to execute on'
        required: true
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted

# The final step commits scraped agenda metadata and pushes via GITHUB_TOKEN;
# Pages/R2 steps authenticate with Cloudflare secrets, not this token.
permissions:
  contents: write

# Serialize runs so an overlapping scheduled + manual run can't collide on the
# git push / Pages deploy. Queue rather than cancel (don't kill an in-flight
# transcription).
concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    # Default to the self-hosted residential runner (trogdor) so scheduled cron
    # runs can transcribe — GitHub-hosted datacenter IPs are blocked by YouTube,
    # and transcribe-assemblyai.mjs hard-skips on RUNNER_ENVIRONMENT=github-hosted.
    # workflow_dispatch can still pick ubuntu-latest for an agenda-only fallback.
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}

    env:
      # API Keys & Auth Tokens
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rclone Cloudflare R2 Remote Configuration
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # trogdor's apt rclone is v1.60.1 (2022): its R2 uploads to existing keys
      # fail with empty-request-id 501 NotImplemented and the retry then reports
      # "nothing to transfer" — which silently dropped every nightly batch of
      # fresh ES translations for 10 days (the stale-refresh cap re-bought the
      # same 25 meetings twice a day). Prefer the pinned current binary.
      - name: Use current rclone (self-hosted tools dir)
        if: runner.environment == 'self-hosted'
        run: echo "/mnt/data/actions-runner/tools" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The self-hosted runner (trogdor) has rclone + yt-dlp pre-installed and no
      # passwordless sudo, so only install on GitHub-hosted runners.
      - name: Install System Dependencies (rclone)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Install yt-dlp (YouTube downloader)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Project Dependencies
        run: npm ci || npm install

      # --with-deps needs sudo for system libs (fine on hosted); on self-hosted the
      # chromium libs are already present, so install the browser without sudo.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install chromium
          fi

      - name: Sync Cache from Cloudflare R2
        run: |
          mkdir -p artifacts
          # Sync slim transcripts from R2 transcripts/ to local artifacts/transcripts-slim/
          rclone copy r2:rcsd-meetings/transcripts/ artifacts/transcripts-slim/ --progress
          # Raw AAI transcripts: R2 is the source of truth — checkout's default
          # `git clean -ffdx` wipes the gitignored artifacts/ tree at the start
          # of every run, so nothing local survives between runs. Keep the
          # restore non-clobbering anyway in case a same-run step already wrote
          # a newer transcript before a retry of this step.
          rclone copy r2:rcsd-meetings/transcripts-aai/ artifacts/transcripts-aai/ \
            --ignore-existing --progress
          # Sync other cache folders (excluding heavy media, json, and transcripts)
          # transcripts-slim/ is a dead legacy bucket prefix (pre-July-2026, no
          # _sourceHash in its -es files; canonical copies live at transcripts/,
          # restored above). Without this exclude it overwrote the fresh restore
          # every run, so every ES translation read as stale and the pipeline
          # re-bought the same 25 translations twice a day (~$15/run, Aug 2026).
          rclone copy r2:rcsd-meetings/ artifacts/ \
            --exclude "audio/**" \
            --exclude "board-packets/**" \
            --exclude "board-packets-cache/**" \
            --exclude "json/**" \
            --exclude "transcripts/**" \
            --exclude "transcripts-aai/**" \
            --exclude "transcripts-slim/**" \
            --progress

      # Operator inbox for out-of-band (re-)transcriptions: anything staged in
      # /mnt/data/actions-runner/transcript-inbox on the self-hosted runner
      # overrides the R2 restore, flows through the normal rebuild, and is
      # published to R2 by the upload step — after which the restore serves it
      # forever. (Absolute path: the runner service runs as gha-runner, whose
      # $HOME is not the operator's.) Used for the July 2026 full-corpus
      # Universal-3.5 Pro backfill (TRANSCRIPTION-BACKFILL.md); clear the inbox
      # once the published files are verified.
      - name: Ingest Staged Transcripts (operator inbox)
        if: runner.environment == 'self-hosted'
        run: |
          INBOX=/mnt/data/actions-runner/transcript-inbox
          if ls "$INBOX"/*.json >/dev/null 2>&1; then
            count=$(ls "$INBOX"/*.json | wc -l)
            echo "Ingesting $count staged transcripts from $INBOX"
            cp "$INBOX"/*.json artifacts/transcripts-aai/
          else
            echo "No staged raw transcripts."
          fi
          # Same pattern for slim transcripts (EN or ES): lets operator-salvaged
          # translation output re-enter the pipeline instead of being
          # re-generated at API cost (used to recover the 2026-07-19 cancelled
          # full-corpus translation run).
          SLIM_INBOX=/mnt/data/actions-runner/slim-inbox
          if ls "$SLIM_INBOX"/*.json >/dev/null 2>&1; then
            count=$(ls "$SLIM_INBOX"/*.json | wc -l)
            echo "Ingesting $count staged slim transcripts from $SLIM_INBOX"
            cp "$SLIM_INBOX"/*.json artifacts/transcripts-slim/
          else
            echo "No staged slim transcripts."
          fi

      - name: Run Data Pipeline (Full or Quick)
        env:
          # 'all' removes the per-run cap on stale-cache refreshes; unset uses
          # each script's default of 25 (see --max-refresh).
          MAX_REFRESH: ${{ github.event.inputs.refresh_all == 'true' && 'all' || '' }}
          # A deliberate uncapped drain legitimately spends more than the $10
          # default per-run cost guard in translate-transcripts.mjs allows;
          # unset falls back to the script default.
          MAX_RUN_COST: ${{ github.event.inputs.refresh_all == 'true' && '150' || '' }}
        run: |
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            node scripts/run-pipeline.mjs --quick
          else
            # On scheduled cron triggers, run the full pipeline
            node scripts/run-pipeline.mjs
          fi

      # Probes rcsdk8.net for facts the site publishes but nothing re-checks
      # (principals, the sitting superintendent, the cabinet roster). Placed
      # before the commit step so the observation record is committed with the
      # run. Never fails the build here: a probe failure or a drift finding is
      # reported by the guard in the final step, so an alert can't cost the
      # run's paid API work. See scripts/verify-live-facts.mjs.
      - name: Probe Live District Facts
        continue-on-error: true
        run: node scripts/verify-live-facts.mjs

      - name: Commit Scraped Agenda Metadata Changes (Incremental)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # meetings-data + LLM caches: committing the pipeline-rebuilt versions
          # keeps git authoritative — a stale git meetings-data.json fed
          # out-of-pipeline page builds that deployed "No transcript" pages to
          # production (June 24 regression, twice), and uncommitted marker/
          # timestamp caches were wiped by checkout each run, re-spending API
          # calls nightly on work already done.
          git add data/board-memos/ data/youtube-index.json data/provenance/ sources/rcsd-meetings.md \
            data/meetings-data.json data/chapter-markers.json data/chapter-markers-cache/ \
            data/timestamp-map.json data/llm-timestamp-cache/ 2>/dev/null || \
          git add data/board-memos/ data/youtube-index.json data/provenance/ sources/rcsd-meetings.md \
            data/meetings-data.json data/chapter-markers.json data/chapter-markers-cache/ data/timestamp-map.json
          # Health record must persist across runs (runner workspace is wiped)
          # for the stuck-drain streak counter to work; asserted post-deploy.
          if [ -e data/translation-health.json ]; then git add data/translation-health.json; fi
          # Freshness observations must persist too: check-freshness.mjs reads
          # lastRun.probedAt to detect that probing itself has stopped.
          if [ -e data/freshness.json ]; then git add data/freshness.json; fi
          # ES translation outputs only exist after a full run; add them only if
          # present so quick runs (which skip translation) don't fail on a
          # pathspec that matches nothing.
          for p in data/board-memos-es data/boarddocs-es.json; do
            [ -e "$p" ] && git add "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update scraped agenda/meeting metadata [skip ci]"
            # A run that queued behind the `ingest-pipeline` concurrency group (or a
            # busy self-hosted runner) can resume with a checkout that is hours stale,
            # so `git push` gets rejected non-fast-forward and the deploy steps are
            # skipped — a freshly-scraped agenda then silently never reaches the site.
            # Rebase onto the current remote tip before pushing so a stale checkout
            # heals itself instead of red-failing. Retry once in case the remote moves
            # again during the rebase.
            # --autostash is load-bearing: the pipeline leaves worktree files
            # this step does not stage, and `pull --rebase` refuses to start
            # while unstaged changes are present.
            git pull --rebase --autostash origin main || true
            git push || (git pull --rebase --autostash origin main && git push)
          else
            echo "No incremental data updates to commit."
          fi

      # Regenerate after the incremental commit so release.gitCommit identifies
      # the exact source commit being deployed. Generated data/docs are allowed;
      # changes to scripts/configuration still fail the clean-source guard.
      - name: Generate and Validate Release Manifest
        run: npm run release:manifest -- --require-clean-source

      # Publish data first. The manifest-driven policy release uploads immutable
      # content, verifies hashes, and refreshes shape-compatible stable URLs.
      # Pages then records a release-bound receipt; current.json advances last.
      - name: Upload Legacy Data & Assets to Cloudflare R2
        run: npm run upload

      - name: Stage Verified Policy Release
        run: npm run release:stage

      - name: Deploy Static Web App to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: npm run release:deploy-pages

      - name: Promote Policy Release as Current
        run: npm run release:promote

      - name: Verify Promoted Release in Production
        run: npm run release:smoke

      # LAST step by design: a tripped guard (runaway API spend, or completed
      # translations being lost run-over-run) must alert via a red run WITHOUT
      # skipping the upload/commit/deploy above — failing earlier would discard
      # this run's paid API work (checkout wipes artifacts/ next run), which is
      # the pay-and-discard failure mode itself. See check-pipeline-health.mjs.
      - name: Assert Pipeline Health Guards
        run: node scripts/check-pipeline-health.mjs

      # Same final-step reasoning: published facts that no longer match their
      # source (a rotated principal, a changed superintendent) alert via a red
      # run without discarding the work above. See scripts/check-freshness.mjs.
      # `!cancelled()` rather than the default `success()`: the health guard
      # above exits nonzero on a tripped cost guard or a stuck drain, which
      # would otherwise SKIP this step — so a run that is already red for one
      # reason would silently stop checking whether the site's published facts
      # still match their sources. The two guards are independent and both must
      # report.
      - name: Assert Published Facts Still Match Their Sources
        if: ${{ !cancelled() }}
        run: node scripts/check-freshness.mjs
