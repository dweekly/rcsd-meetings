name: Scheduled Board Ingestion Pipeline

on:
  schedule:
    # Run twice daily at 6:00 AM and 6:00 PM UTC (11:00 PM and 11:00 AM PDT)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick mode (skip transcription, translation, and LLM mapping)'
        required: true
        type: boolean
        default: false
      runner:
        description: 'Runner environment to execute on'
        required: true
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted

# The final step commits scraped agenda metadata and pushes via GITHUB_TOKEN;
# Pages/R2 steps authenticate with Cloudflare secrets, not this token.
permissions:
  contents: write

# Serialize runs so an overlapping scheduled + manual run can't collide on the
# git push / Pages deploy. Queue rather than cancel (don't kill an in-flight
# transcription).
concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    # Default to the self-hosted residential runner (trogdor) so scheduled cron
    # runs can transcribe — GitHub-hosted datacenter IPs are blocked by YouTube,
    # and transcribe-assemblyai.mjs hard-skips on RUNNER_ENVIRONMENT=github-hosted.
    # workflow_dispatch can still pick ubuntu-latest for an agenda-only fallback.
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}

    env:
      # API Keys & Auth Tokens
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Rclone Cloudflare R2 Remote Configuration
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The self-hosted runner (trogdor) has rclone + yt-dlp pre-installed and no
      # passwordless sudo, so only install on GitHub-hosted runners.
      - name: Install System Dependencies (rclone)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Install yt-dlp (YouTube downloader)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Project Dependencies
        run: npm ci || npm install

      # --with-deps needs sudo for system libs (fine on hosted); on self-hosted the
      # chromium libs are already present, so install the browser without sudo.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install chromium
          fi

      - name: Sync Cache from Cloudflare R2
        run: |
          mkdir -p artifacts
          # Sync slim transcripts from R2 transcripts/ to local artifacts/transcripts-slim/
          rclone copy r2:rcsd-meetings/transcripts/ artifacts/transcripts-slim/ --progress
          # Sync other cache folders (excluding heavy media, json, and transcripts)
          rclone copy r2:rcsd-meetings/ artifacts/ \
            --exclude "audio/**" \
            --exclude "board-packets/**" \
            --exclude "board-packets-cache/**" \
            --exclude "json/**" \
            --exclude "transcripts/**" \
            --progress

      - name: Run Data Pipeline (Full or Quick)
        run: |
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            node scripts/run-pipeline.mjs --quick
          else
            # On scheduled cron triggers, run the full pipeline
            node scripts/run-pipeline.mjs
          fi

      - name: Commit Scraped Agenda Metadata Changes (Incremental)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/board-memos/ data/youtube-index.json data/provenance/ sources/rcsd-meetings.md
          # ES translation outputs only exist after a full run; add them only if
          # present so quick runs (which skip translation) don't fail on a
          # pathspec that matches nothing.
          for p in data/board-memos-es data/boarddocs-es.json; do
            [ -e "$p" ] && git add "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update scraped agenda/meeting metadata [skip ci]"
            git push
          else
            echo "No incremental data updates to commit."
          fi

      # Regenerate after the incremental commit so release.gitCommit identifies
      # the exact source commit being deployed. Generated data/docs are allowed;
      # changes to scripts/configuration still fail the clean-source guard.
      - name: Generate and Validate Release Manifest
        run: npm run release:manifest -- --require-clean-source

      # Publish data first. The manifest-driven policy release uploads immutable
      # content, verifies hashes, and refreshes shape-compatible stable URLs.
      # Pages then records a release-bound receipt; current.json advances last.
      - name: Upload Legacy Data & Assets to Cloudflare R2
        run: npm run upload

      - name: Stage Verified Policy Release
        run: npm run release:stage

      - name: Deploy Static Web App to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: npm run release:deploy-pages

      - name: Promote Policy Release as Current
        run: npm run release:promote

      - name: Verify Promoted Release in Production
        run: npm run release:smoke
